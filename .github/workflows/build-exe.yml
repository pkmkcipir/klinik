name: Build Windows 11 EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build SistemAntrianKlinik EXE
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer EXE ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SistemAntrianKlinik-KlinikBidanDewiAnjani
          path: |
            dist/*.exe
